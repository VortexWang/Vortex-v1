# VORTEX CI（QA-T02、QA-T03、ENGR-003～ENGR-005）
# 版本以 docs/engineering-baseline.md 为准，任何 action 与工具都锁定版本。
name: ci
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: "1.24.7" }
      - name: gofmt
        run: test -z "$(gofmt -l engine edge-hub node test/e2e)"
      - name: vet
        run: go vet ./engine/... ./edge-hub/... ./node/... ./test/e2e/...
      # 失败时把失败测试的输出写成注解：日志下载在部分环境中不可用，注解可经 API 读取
      - name: test (race)
        run: set -o pipefail; go test -race -count=1 ./engine/... ./edge-hub/... ./node/... ./test/e2e/... 2>&1 | tee /tmp/race.log
      - name: leak and splice tests as root (需要 /proc 与真实 TCP)
        run: set -o pipefail; sudo env "PATH=$PATH" go test -count=1 -run 'Leak|Splice' ./engine/... 2>&1 | tee /tmp/root.log
      - name: 模糊测试（帧解析与链路帧处理，ENG-T37）
        run: |
          set -o pipefail
          go test -run XXX -fuzz FuzzFrames -fuzztime 20s ./engine/vlink 2>&1 | tail -3 | tee -a /tmp/race.log
          go test -run XXX -fuzz FuzzLinkFrames -fuzztime 40s ./engine/vlink 2>&1 | tail -3 | tee -a /tmp/race.log
      - name: 失败测试注解
        if: failure()
        run: |
          for f in /tmp/race.log /tmp/root.log; do
            [ -f "$f" ] || continue
            body=$(grep -E -A12 -e '--- FAIL|panic:|DATA RACE' "$f" | head -c 20000 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            [ -n "$body" ] && echo "::error title=$f::$body"
          done
      - name: license check (ENGR-002)
        run: |
          go install github.com/google/go-licenses@v1.6.0
          go-licenses check ./engine/... ./edge-hub/... ./node/... ./proto/gen/go/... --disallowed_types=forbidden,restricted

  netns-bench:
    # ENGR-005：网络命名空间拓扑的吞吐冒烟（短时长，按 NFR-001 / NFR-005 阈值判定）。
    # 正式测量（预热 60 秒、测试 300 秒、三次取中位数）在 13.2 节环境中用同一脚本执行。
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: "1.24.7" }
      - name: 安装 iperf3
        run: sudo apt-get update -q && sudo DEBIAN_FRONTEND=noninteractive apt-get install -yq iperf3
      - name: 基准冒烟
        # UDP 两端 4 MiB 缓冲需要 rmem_max 至少 4 MiB（见 docs/benchmark.md）
        run: |
          sudo sysctl -w net.core.rmem_max=4194304 net.core.wmem_max=4194304
          sudo env "PATH=$PATH" WARMUP=3 DURATION=15 RUNS=1 UDP_DURATION=15 OUT=bench-out scripts/bench/netns-bench.sh
      - name: 三中继多跳基准冒烟（NFR-003）
        run: sudo env "PATH=$PATH" WARMUP=3 DURATION=15 RUNS=1 OUT=bench-out/multihop scripts/bench/multihop-bench.sh
      - name: 隧道基准冒烟（NFR-002 / NFR-004 / NFR-007）
        run: sudo env "PATH=$PATH" WARMUP=3 DURATION=15 RUNS=1 TTFB_N=100 OUT=bench-out/tunnel scripts/bench/tunnel-bench.sh
      - if: always()
        uses: actions/upload-artifact@v4
        with: { name: netns-bench, path: bench-out, if-no-files-found: ignore }
      - name: 失败时把汇总与引擎错误输出写成注解（便于通过 API 查看）
        if: failure()
        run: |
          for f in bench-out/error.txt bench-out/summary.md bench-out/engine.err bench-out/env.txt bench-out/tunnel/error.txt bench-out/tunnel/summary.md bench-out/multihop/error.txt bench-out/multihop/summary.md; do
            [ -s "$f" ] || continue
            body=$(sed 's/%/%25/g' "$f" | head -c 20000 | awk '{printf "%s%%0A", $0}')
            echo "::error title=$f::$body"
          done
          ls -la bench-out || true

  soak:
    # ENG-T39：长稳与泄漏回归的缩短版（负载 150 秒（含 60 秒预热）、清空后 200 秒；需求 13.3 节为预热 1 小时 + 24 小时、清空后 10 分钟）
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: "1.24.7" }
      - name: vxsoak
        run: |
          set -o pipefail
          go run ./engine/cmd/vxsoak -load 150s -drain 200s -out soak-out 2>&1 | grep -v " load: " | tee /tmp/soak.log
      - name: 失败注解
        if: failure()
        run: |
          body=$( (cat soak-out/soak.json 2>/dev/null || tail -50 /tmp/soak.log) | head -c 20000 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
          echo "::error title=soak::$body"

  proto:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: bufbuild/buf-setup-action@v1
        # 必须带令牌：匿名下载会因共享出口 IP 触发 GitHub API 限流而随机失败
        with: { version: "1.47.2", github_token: "${{ github.token }}" }
      - name: buf lint
        run: buf lint proto
      - name: buf breaking（相对 main，ENGR-004）
        if: github.event_name == 'pull_request'
        run: buf breaking proto --against ".git#branch=origin/main,subdir=proto"

  codegen:
    # 契约能否被 Go 工具链实际使用：proto → Go（含 gRPC），OpenAPI → Gin 服务端接口，生成后必须能编译
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: "1.24.7" }
      - uses: bufbuild/buf-setup-action@v1
        # 必须带令牌：匿名下载会因共享出口 IP 触发 GitHub API 限流而随机失败
        with: { version: "1.47.2", github_token: "${{ github.token }}" }
      - name: 安装生成器（版本见 docs/engineering-baseline.md）
        run: |
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.6
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@v1.5.1
          go install github.com/oapi-codegen/oapi-codegen/v2/cmd/oapi-codegen@v2.4.1
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: proto → Go：重新生成并与提交的 proto/gen/go 比对，再编译
        run: |
          cd proto && rm -rf gen/go/vortex && buf generate --exclude-path gen
          git diff --exit-code -- gen/go || { echo "::error::proto/gen/go 与契约不一致：在 proto 目录运行 buf generate 后提交"; exit 1; }
          test -z "$(git status --porcelain -- gen/go)" || { git status --porcelain -- gen/go; echo "::error::proto/gen/go 有未提交的生成文件"; exit 1; }
          cd gen/go && go vet ./... && go build ./...
      - name: OpenAPI → Gin 服务端接口并编译
        run: |
          mkdir -p /tmp/oapi && cd /tmp/oapi && go mod init vortex/api/gen
          oapi-codegen -generate types,gin-server,spec -package apiv1 "$GITHUB_WORKSPACE/api/openapi.yaml" > api.gen.go
          go mod tidy && go vet ./... && go build ./...

  api:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22.23.4" }
      - run: pip install pyyaml==6.0.2 openapi-spec-validator==0.7.1
      - name: 生成结果与提交一致
        run: cd api && python3 gen_openapi.py > /tmp/openapi.yaml && diff -u openapi.yaml /tmp/openapi.yaml
      - name: 结构校验
        run: python3 -c "import yaml; from openapi_spec_validator import validate; validate(yaml.safe_load(open('api/openapi.yaml')))"
      - name: redocly lint
        run: npx -y @redocly/cli@1.34.0 lint api/openapi.yaml
      - name: 前端类型契约
        run: |
          npx -y openapi-typescript@7.4.4 api/openapi.yaml --default-non-nullable false -o api/tests/vortex-api.d.ts
          npx -y -p typescript@5.6.3 tsc --strict --noEmit --target es2022 --moduleResolution bundler --module esnext api/tests/typecheck.ts

  db:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: vortex, POSTGRES_PASSWORD: ci, POSTGRES_DB: vortex }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U vortex" --health-interval 2s --health-retries 30
    env:
      PGHOST: localhost
      PGUSER: vortex
      PGPASSWORD: ci
      PGDATABASE: vortex
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: "1.24.7" }
      - name: 迁移 Up / 约束测试 / Down / Up（按 Goose 文件格式拆分执行）
        run: scripts/db-check.sh
      - name: 用 Goose 本身执行迁移（ENGR-004）
        run: |
          go install github.com/pressly/goose/v3/cmd/goose@v3.24.1
          export GOOSE_DRIVER=postgres GOOSE_DBSTRING="postgres://vortex:ci@localhost:5432/vortex?sslmode=disable"
          psql -c "DROP SCHEMA public CASCADE; CREATE SCHEMA public;"
          "$(go env GOPATH)/bin/goose" -dir backend/migrations up
          "$(go env GOPATH)/bin/goose" -dir backend/migrations status
          for t in backend/migrations/tests/*_test.sql; do psql -v ON_ERROR_STOP=1 -q -f "$t" >/dev/null; echo "pass $t"; done
          "$(go env GOPATH)/bin/goose" -dir backend/migrations reset
          "$(go env GOPATH)/bin/goose" -dir backend/migrations up

  budget-sim:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: 额度语义模拟（契约语义 0 违例，对照组必须出现违例）
        run: python3 test/budget-sim/budget_sim.py && python3 test/budget-sim/budget_sim.py --delta

  deploy:
    # 部署文件（AGT-T17、HUB-T17）：安装脚本、systemd 单元校验与安全评估、容器镜像可构建且可运行。
    # 安装脚本的功能由 test/e2e TestInstallScripts 验证
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: 安装脚本与 systemd 单元
        run: sudo sh scripts/deploy-check.sh
      - name: 容器镜像
        run: |
          docker build -f deploy/node/Dockerfile --build-arg VERSION=ci -t vortex-node:ci .
          docker build -f deploy/edge-hub/Dockerfile --build-arg VERSION=ci -t vortex-edge-hub:ci .
          test "$(docker run --rm vortex-node:ci version)" = ci
          test "$(docker run --rm vortex-edge-hub:ci version)" = ci
          docker run --rm vortex-node:ci version -json | grep -q '"store_schema":1'
          # 镜像以非 root 运行
          test "$(docker inspect -f '{{.Config.User}}' vortex-node:ci)" = nonroot:nonroot
