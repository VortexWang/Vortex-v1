# VORTEX CI（QA-T02、QA-T03、ENGR-003～ENGR-005）
# 版本以 docs/engineering-baseline.md 为准，任何 action 与工具都锁定版本。
name: ci
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: "1.24.7" }
      - name: gofmt
        run: test -z "$(gofmt -l engine)"
      - name: vet
        run: go vet ./engine/...
      - name: test (race)
        run: go test -race -count=1 ./engine/...
      - name: leak and splice tests as root (需要 /proc 与真实 TCP)
        run: sudo env "PATH=$PATH" go test -count=1 -run 'Leak|Splice' ./engine/...
      - name: license check (ENGR-002)
        run: |
          go install github.com/google/go-licenses@v1.6.0
          go-licenses check ./engine/... --disallowed_types=forbidden,restricted

  proto:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: bufbuild/buf-setup-action@v1
        with: { version: "1.47.2" }
      - name: buf lint
        run: buf lint proto
      - name: buf breaking（相对 main，ENGR-004）
        if: github.event_name == 'pull_request'
        run: buf breaking proto --against ".git#branch=origin/main,subdir=proto"

  api:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22.23.4" }
      - run: pip install pyyaml==6.0.2 openapi-spec-validator==0.7.1
      - name: 生成结果与提交一致
        run: cd api && python3 gen_openapi.py > /tmp/openapi.yaml && diff -u openapi.yaml /tmp/openapi.yaml
      - name: 结构校验
        run: python3 -c "import yaml; from openapi_spec_validator import validate; validate(yaml.safe_load(open('api/openapi.yaml')))"
      - name: redocly lint
        run: npx -y @redocly/cli@1.34.0 lint api/openapi.yaml
      - name: 前端类型契约
        run: |
          npx -y openapi-typescript@7.4.4 api/openapi.yaml --default-non-nullable false -o api/tests/vortex-api.d.ts
          npx -y -p typescript@5.6.3 tsc --strict --noEmit --target es2022 --moduleResolution bundler --module esnext api/tests/typecheck.ts

  db:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: vortex, POSTGRES_PASSWORD: ci, POSTGRES_DB: vortex }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U vortex" --health-interval 2s --health-retries 30
    env:
      PGHOST: localhost
      PGUSER: vortex
      PGPASSWORD: ci
      PGDATABASE: vortex
    steps:
      - uses: actions/checkout@v4
      - name: 迁移 Up / 约束测试 / Down / Up
        run: scripts/db-check.sh

  budget-sim:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: 额度语义模拟（契约语义 0 违例，对照组必须出现违例）
        run: python3 test/budget-sim/budget_sim.py && python3 test/budget-sim/budget_sim.py --delta
