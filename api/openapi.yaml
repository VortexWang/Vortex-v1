components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: vortex_session
      description: HttpOnly、Secure、SameSite=Strict
    csrfToken:
      type: apiKey
      in: header
      name: X-CSRF-Token
      description: 双提交令牌，登录响应中下发
  parameters:
    IfMatch:
      name: If-Match
      in: header
      required: true
      schema:
        type: string
      description: 资源的 ETag（row_version），不匹配返回 412
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      schema:
        type: string
        minLength: 8
        maxLength: 128
      description: 相同键的重复请求返回首次结果（PLN-004）
  responses:
    BadRequest:
      description: 请求格式错误
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: 未登录或会话失效
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: 无权限、CSRF 校验失败或需要近期 TOTP
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: 资源不存在（含跨租户访问）
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: 与当前状态冲突，如端口占用、依赖存在
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    PreconditionFailed:
      description: If-Match 与当前版本不符
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unprocessable:
      description: 业务校验失败，如路径无段许可、超出套餐限制
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    TooManyRequests:
      description: 限流（SEC-005）
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ControlDegraded:
      description: 控制面降级，暂不接受写操作（FE-012）
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    Accepted:
      type: object
      properties:
        desired_version:
          type: integer
          format: int64
      additionalProperties: false
      description: 保存成功不等于已生效（7.5 节）；后续状态经 SSE 推送
    Announcement:
      type: object
      properties:
        id: *id008
        title: &id012
          type: string
        body: *id012
        published_at:
          type:
          - string
          - 'null'
          format: date-time
      additionalProperties: false
      required:
      - id
      - title
      - body
    AnnouncementInput:
      type: object
      properties:
        title: *id012
        body: *id012
        publish: &id014
          type: boolean
      additionalProperties: false
      required:
      - title
      - body
    AnnouncementPage:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Announcement'
        next_cursor:
          type:
          - string
          - 'null'
      additionalProperties: false
      required:
      - items
      - next_cursor
    AuditLog:
      type: object
      properties:
        id:
          type: integer
          format: int64
        created_at: *id011
        actor_kind:
          type: string
          enum:
          - user
          - system
          - node
          - hub
        actor_id:
          type:
          - string
          - 'null'
        tenant_id:
          type:
          - string
          - 'null'
        action: *id012
        target_kind:
          type:
          - string
          - 'null'
        target_id:
          type:
          - string
          - 'null'
        detail:
          type: object
