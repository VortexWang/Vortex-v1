openapi: 3.1.0
info:
  title: VORTEX 对外 API
  version: 1.0.0
  license:
    name: Proprietary（闭源商业发布，ENGR-002）
    identifier: LicenseRef-VORTEX-Proprietary
  description: '契约 C4（v1，已锁定）。基线：《VORTEX 需求规格说明书 V1.7（已冻结）》。


    约定：字段 snake_case；时间 RFC 3339 UTC；流量为整数字节；速率为 bit/s。写请求必须携带 X-CSRF-Token 头并校验 Origin。跨租户访问统一返回 404 RESOURCE_NOT_FOUND，不暴露存在性。控制面降级时写请求返回
    503 CONTROL_DEGRADED（FE-012）。运行配置与 VLink 不通过本 API 暴露（GEN-007）。'
servers:
- url: /api/v1
security:
- sessionCookie: []
tags:
- name: auth
  description: 登录、二步验证、退出
- name: me
  description: 用户端概览与实时事件
- name: me-rules
  description: 规则、路径编辑、变更预检、延迟
- name: me-nodes
  description: 自托管节点与个人组
- name: me-billing
  description: 套餐、流量包、兑换、用量
- name: me-account
  description: 通知、公告、个人设置与账号安全
- name: admin
  description: 管理员概览与实时事件
- name: admin-users
  description: 用户与跨租户规则查看
- name: admin-fleet
  description: 节点、节点组、段许可、Edge Hub
- name: admin-billing
  description: 计费版本、套餐、权益码、争议
- name: admin-dns
  description: DNS 服务商与解析记录
- name: admin-ops
  description: 公告、审计、系统设置
paths:
  /auth/login:
    post:
      operationId: login
      summary: 登录
      tags:
      - auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '400': &id001
          $ref: '#/components/responses/BadRequest'
        '409': &id002
          $ref: '#/components/responses/Conflict'
        '422': &id003
          $ref: '#/components/responses/Unprocessable'
        '429': &id004
          $ref: '#/components/responses/TooManyRequests'
      security: []
  /auth/totp/verify:
    post:
      operationId: verifyTotp
      summary: 二步验证
      tags:
      - auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TotpVerifyRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '400': *id001
        '401': &id005
          $ref: '#/components/responses/Unauthorized'
        '403': &id006
          $ref: '#/components/responses/Forbidden'
        '409': *id002
        '422': *id003
        '429': *id004
        '503': &id007
          $ref: '#/components/responses/ControlDegraded'
      security:
      - sessionCookie: []
        csrfToken: []
  /auth/logout:
    post:
      operationId: logout
      summary: 退出
      tags:
      - auth
      responses:
        '204':
          description: No Content
        '400': *id001
        '401': *id005
        '403': *id006
        '409': *id002
        '422': *id003
        '429': *id004
        '503': *id007
      security:
      - sessionCookie: []
        csrfToken: []
  /me/overview:
    get:
      operationId: getOverview
      summary: 概览
      tags:
      - me
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Overview'
        '400': *id001
        '401': *id005
        '429': *id004
  /me/rules:
    get:
      operationId: listRules
      summary: 规则列表（第一列名称、第二列入口地址）
      tags:
      - me-rules
      parameters:
      - name: q
        in: query
        required: false
        schema:
          type: string
        description: 按名称搜索
      - name: cursor
        in: query
        required: false
        schema:
          type: string
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RulePage'
        '400': *id001
        '401': *id005
        '429': *id004
    post:
      operationId: createRule
      summary: 创建规则（两阶段应用异步进行）
      tags:
      - me-rules
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RuleInput'
      responses:
        '201':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Rule'
        '400': *id001
        '401': *id005
        '403': *id006
        '409': *id002
        '422': *id003
        '429': *id004
        '503': *id007
      security:
      - sessionCookie: []
        csrfToken: []
  /me/rules/{rule_id}:
    get:
      operationId: getRule
      summary: 规则详情（含五层状态与逐节点版本）
      tags:
      - me-rules
      parameters:
      - name: rule_id
        in: path
        required: true
        schema: &id008
          type: string
          format: uuid
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RuleDetail'
          headers:
            ETag:
              schema:
                type: string
              description: = row_version
        '400': *id001
        '401': *id005
        '404': &id009
          $ref: '#/components/responses/NotFound'
        '429': *id004
    patch:
      operationId: updateRule
      summary: 修改规则
      tags:
      - me-rules
      parameters:
      - name: rule_id
        in: path
        required: true
        schema: *id008
      - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RulePatch'
      responses:
        '202':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Accepted'
        '400': *id001
        '401': *id005
        '403': *id006
        '404': *id009
        '409': *id002
        '412': &id010
          $ref: '#/components/responses/PreconditionFailed'
        '422': *id003
        '429': *id004
        '503': *id007
      security:
      - sessionCookie: []
        csrfToken: []
    delete:
      operationId: deleteRule
      summary: 删除规则（立即发起端口释放）
      tags:
      - me-rules
      parameters:
      - name: rule_id
        in: path
        required: true
        schema: *id008
      - $ref: '#/components/parameters/IfMatch'
      responses:
        '204':
          description: No Content
        '400': *id001
        '401': *id005
        '403': *id006
        '404': *id009
        '409': *id002
        '412': *id010
        '422': *id003
        '429': *id004
        '503': *id007
      security:
      - sessionCookie: []
        csrfToken: []
      x-vortex-recent-totp: true
      description: 敏感操作：要求最近 10 分钟内完成 TOTP 校验，否则返回 403 AUTH_TOTP_REQUIRED。
  /me/rule-previews:
    post:
      operationId: previewRule
      summary: 变更预检：影响分类、受影响会话数、路径系数
      tags:
      - me-rules
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RulePreviewRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RulePreview'
        '400': *id001
        '401': *id005
        '403': *id006
        '409': *id002
        '422': *id003
        '429': *id004
        '503': *id007
      security:
      - sessionCookie: []
        csrfToken: []
  /me/rules/{rule_id}/enable:
    post:
      operationId: enableRule
      summary: 启用
      tags:
      - me-rules
      parameters:
      - name: rule_id
        in: path
        required: true
        schema: *id008
      responses:
        '202':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Accepted'
        '400': *id001
        '401': *id005
        '403': *id006
        '404': *id009
        '409': *id002
        '422': *id003
        '429': *id004
        '503': *id007
      security:
      - sessionCookie: []
        csrfToken: []
  /me/rules/{rule_id}/disable:
    post:
      operationId: disableRule
      summary: 停用（端口保留）
      tags:
      - me-rules
      parameters:
      - name: rule_id
        in: path
        required: true
        schema: *id008
      responses:
        '202':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Accepted'
        '400': *id001
        '401': *id005
        '403': *id006
        '404': *id009
        '409': *id002
        '422': *id003
        '429': *id004
        '503': *id007
      security:
      - sessionCookie: []
        csrfToken: []
  /me/rules/{rule_id}/release-port:
    post:
      operationId: releaseRulePort
      summary: 主动释放端口（不可逆）
      tags:
      - me-rules
      parameters:
      - name: rule_id
        in: path
        required: true
        schema: *id008
      responses:
        '202':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Accepted'
        '400': *id001
        '401': *id005
        '403': *id006
        '404': *id009
        '409': *id002
        '422': *id003
        '429': *id004
        '503': *id007
      security:
      - sessionCookie: []
        csrfToken: []
      x-vortex-recent-totp: true
      description: 敏感操作：要求最近 10 分钟内完成 TOTP 校验，否则返回 403 AUTH_TOTP_REQUIRED。
  /me/rules/{rule_id}/latency:
    get:
      operationId: getRuleLatency
      summary: 按段实测延迟
      tags:
      - me-rules
      parameters:
      - name: rule_id
        in: path
        required: true
        schema: *id008
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RuleLatency'
        '400': *id001
        '401': *id005
        '404': *id009
        '429': *id004
  /me/path-options:
    get:
      operationId: getPathOptions
      summary: 路径编辑器候选（有权限且有段许可）
      tags:
      - me-rules
      parameters:
      - name: entry_group_id
        in: query
        required: false
        schema: *id008
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PathOptions'
        '400': *id001
        '401': *id005
        '429': *id004
  /me/nodes:
    get:
      operationId: listMyNodes
      summary: 自托管节点
      tags:
      - me-nodes
      parameters:
      - name: cursor
        in: query
        required: false
        schema:
          type: string
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NodePage'
        '400': *id001
        '401': *id005
        '429': *id004
  /me/nodes/{node_id}:
    delete:
      operationId: deleteMyNode
      summary: 删除自托管节点
      tags:
      - me-nodes
      parameters:
      - name: node_id
        in: path
        required: true
        schema: *id008
      responses:
        '204':
          description: No Content
        '400': *id001
        '401': *id005
        '403': *id006
        '404': *id009
        '409': *id002
        '422': *id003
        '429': *id004
        '503': *id007
      security:
      - sessionCookie: []
        csrfToken: []
      x-vortex-recent-totp: true
      description: 敏感操作：要求最近 10 分钟内完成 TOTP 校验，否则返回 403 AUTH_TOTP_REQUIRED。
  /me/enroll-tokens:
    post:
      operationId: createMyEnrollToken
      summary: 生成注册令牌与安装命令
      tags:
      - me-nodes
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EnrollTokenRequest'
      responses:
        '201':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnrollToken'
        '400': *id001
        '401': *id005
        '403': *id006
        '409': *id002
        '422': *id003
        '429': *id004
        '503': *id007
      security:
      - sessionCookie: []
        csrfToken: []
  /me/node-groups:
    get:
      operationId: listMyNodeGroups
      summary: 个人组
      tags:
      - me-nodes
      parameters:
      - name: cursor
        in: query
        required: false
        schema:
          type: string
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NodeGroupPage'
        '400': *id001
        '401': *id005
        '429': *id004
    post:
      operationId: createMyNodeGroup
      summary: 创建个人组
      tags:
      - me-nodes
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NodeGroupInput'
      responses:
        '201':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NodeGroup'
        '400': *id001
        '401': *id005
        '403': *id006
        '409': *id002
        '422': *id003
        '429': *id004
        '503': *id007
      security:
      - sessionCookie: []
        csrfToken: []
  /me/node-groups/{group_id}:
    get:
      operationId: getMyNodeGroup
      summary: 个人组详情
      tags:
      - me-nodes
      parameters:
      - name: group_id
        in: path
        required: true
        schema: *id008
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NodeGroup'
          headers:
            ETag:
              schema:
                type: string
              description: = row_version
        '400': *id001
        '401': *id005
        '404': *id009
        '429': *id004
    patch:
      operationId: updateMyNodeGroup
      summary: 修改个人组
      tags:
      - me-nodes
      parameters:
      - name: group_id
        in: path
        required: true
        schema: *id008
      - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NodeGroupPatch'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NodeGroup'
        '400': *id001
        '401': *id005
        '403': *id006
        '404': *id009
        '409': *id002
        '412': *id010
        '422': *id003
        '429': *id004
        '503': *id007
      security:
      - sessionCookie: []
        csrfToken: []
    delete:
      operationId: deleteMyNodeGroup
      summary: 删除个人组
      tags:
      - me-nodes
      parameters:
      - name: group_id
        in: path
        required: true
        schema: *id008
      - $ref: '#/components/parameters/IfMatch'
      responses:
        '204':
          description: No Content
        '400': *id001
        '401': *id005
        '403': *id006
        '404': *id009
        '409': *id002
        '412': *id010
        '422': *id003
        '429': *id004
        '503': *id007
      security:
      - sessionCookie: []
        csrfToken: []
  /me/node-groups/{group_id}/members/{node_id}:
    put:
      operationId: putMyGroupMember
      summary: 加入或更新成员
      tags:
      - me-nodes
      parameters:
      - name: group_id
        in: path
        required: true
        schema: *id008
      - name: node_id
        in: path
        required: true
        schema: *id008
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MemberInput'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GroupMember'
        '400': *id001
        '401': *id005
        '403': *id006
        '404': *id009
        '409': *id002
        '422': *id003
        '429': *id004
        '503': *id007
      security:
      - sessionCookie: []
        csrfToken: []
    delete:
      operationId: deleteMyGroupMember
      summary: 移除成员
      tags:
      - me-nodes
      parameters:
      - name: group_id
        in: path
        required: true
        schema: *id008
      - name: node_id
        in: path
        required: true
        schema: *id008
      responses:
        '204':
          description: No Content
        '400': *id001
        '401': *id005
        '403': *id006
        '404': *id009
        '409': *id002
        '422': *id003
        '429': *id004
        '503': *id007
      security:
      - sessionCookie: []
        csrfToken: []
  /me/subscription:
    get:
      operationId: getSubscription
      summary: 我的套餐与余额
      tags:
      - me-billing
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Subscription'
        '400': *id001
        '401': *id005
        '429': *id004
  /me/traffic-packs:
    get:
      operationId: listTrafficPacks
      summary: 流量包
      tags:
      - me-billing
      parameters:
      - name: cursor
        in: query
        required: false
        schema:
          type: string
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrafficPackPage'
        '400': *id001
        '401': *id005
        '429': *id004
  /me/redemption-previews:
    post:
      operationId: previewRedemption
      summary: 兑换预览（展示损失）
      tags:
      - me-billing
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RedemptionRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RedemptionPreview'
        '400': *id001
        '401': *id005
        '403': *id006
        '409': *id002
        '422': *id003
        '429': *id004
        '503': *id007
      security:
      - sessionCookie: []
        csrfToken: []
  /me/redemptions:
    post:
      operationId: redeem
      summary: 兑换权益码
      tags:
      - me-billing
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RedemptionRequest'
      responses:
        '201':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Redemption'
        '400': *id001
        '401': *id005
        '403': *id006
        '409': *id002
        '422': *id003
        '429': *id004
        '503': *id007
      security:
      - sessionCookie: []
        csrfToken: []
  /me/usage:
    get:
      operationId: getUsage
      summary: 流量统计（原始与计费）
      tags:
      - me-billing
      parameters:
      - name: granularity
        in: query
        required: false
        schema:
          type: string
          enum:
          - minute
          - day
      - name: from
        in: query
        required: false
        schema: &id011
          type: string
          format: date-time
          description: RFC 3339 UTC
      - name: to
        in: query
        required: false
        schema: *id011
      - name: rule_id
        in: query
        required: false
        schema: *id008
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsageSeries'
        '400': *id001
        '401': *id005
        '429': *id004
  /me/notifications:
    get:
      operationId: listNotifications
      summary: 站内通知
      tags:
      - me-account
      parameters:
      - name: cursor
        in: query
        required: false
        schema:
          type: string
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationPage'
        '400': *id001
        '401': *id005
        '429': *id004
  /me/notifications/mark-read:
    post:
      operationId: markNotificationsRead
      summary: 标记已读
      tags:
      - me-account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MarkReadRequest'
      responses:
        '204':
          description: No Content
        '400': *id001
        '401': *id005
        '403': *id006
        '409': *id002
        '422': *id003
        '429': *id004
        '503': *id007
      security:
      - sessionCookie: []
        csrfToken: []
  /me/announcements:
    get:
      operationId: listAnnouncements
      summary: 公告
      tags:
